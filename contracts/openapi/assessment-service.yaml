openapi: 3.0.3
info:
  title: LearnUP Assessment Service API
  version: 1.0.0
  description: Internal Assessment integration endpoints, Organizer Course review (UC21.2), completion snapshots and Course deletion cleanup. Internal routes require a service key; Organizer review requires JWT.
security:
  - InternalKey: []
paths:
  /api/v1/assessments/internal/courses/{courseId}:
    delete:
      operationId: deleteCourseAssessments
      summary: Delete Quiz and Assignment data for a permanently deleted Course version (UC14.5.2 / BR-341)
      description: >-
        Internal Course Service call only. Requires x-internal-key and
        x-organization-id; it does not accept end-user context.
        Deletes Assessment records (Quiz and Assignment) belonging to the
        specified Course version and Organization, including eligible dependent
        records according to the database relations. Other Course versions and
        Organizations are not affected. A repeated request with no matching
        assessments succeeds with zero deletion counts. Prompt-file cleanup
        is best-effort in the current implementation; callers must not treat
        this response as proof that all Cloudinary objects were removed.
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
        - name: courseId
          in: path
          required: true
          description: UUID of one Course version, not a Course Chain.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Assessment cleanup result in the common API envelope.
          content:
            application/json:
              schema:
                type: object
                required: [statusCode, message, data]
                properties:
                  statusCode: { type: integer, enum: [200] }
                  message: { type: string }
                  data:
                    type: object
                    additionalProperties: false
                    required: [courseId, deleted, deletedCount, deletedQuizCount, deletedAssignmentCount]
                    properties:
                      courseId: { type: string, format: uuid }
                      deleted: { type: boolean, enum: [true] }
                      deletedCount: { type: integer, minimum: 0 }
                      deletedQuizCount: { type: integer, minimum: 0 }
                      deletedAssignmentCount: { type: integer, minimum: 0 }
        "400":
          description: Invalid Course UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing/invalid internal key or missing/malformed Organization context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Database cleanup failed. Caller should retry safely.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/internal/learners/{learnerId}/courses/{courseId}/completion-snapshot:
    get:
      summary: What a Learner has done in the Quizzes and Assignments a Course requires (CT-1)
      description: |
        Called by learning-service to decide whether the Learner has finished the Course. The caller sends `x-internal-key` and `x-organization-id`; no user or role is sent or checked. `organizationId` in the query is optional; when it is sent it must equal the header, otherwise the answer is 404.

        Computed on read, nothing is stored. The required components are every Assignment and every Quiz marked required, not Disabled (BR-206). A Course with none is `eligible: true` with `requiredComponentCount: 0`.

        Rules (they follow the validator of learning-service word for word; a snapshot that breaks one is rejected there as INVALID_SNAPSHOT):
        - Quiz: `recordedScore` is the best submitted attempt (BR-198), the earlier one on a tie. `passed` is `attemptId` and `recordedScore` present and `recordedScore >= passingScore`.
        - Assignment: the newest submission that was not replaced (BR-170). `finalScore` and `finalizedAt` are present only when the grading status is Finalized (BR-212). `passed` is `submissionId`, `finalizedAt`, `finalScore` present and `finalScore >= passingScore`.
        - peerReview: only the reviews the Learner owes as a peer, never the Instructor's, and of those only the ones of the latest cycle (by closing time) in which the Learner has review assignments (BR-236, BR-238, BR-239): a review Missed in an earlier cycle is a debt that the reviews of a later cycle pay. None means NotApplicable with 0 of 0. Any review of that cycle missed, or still Pending past the deadline of its cycle (judged at read time), means Missed; all done means Satisfied; otherwise Pending. A later cycle in which the Learner has no assignment (too few submissions, BR-242) does not erase an earlier Missed. `requiredCount` and `completedCount` count the reviews of that cycle. When the Instructor has waived the duty of the Learner on the Assignment (UC33.2, BR-241) the status is Waived whatever the reviews say, and the counts stay as they are.
        - `eligible` is true when every component is passed and every peerReview is NotApplicable, Satisfied or Waived.
        - Scores are text with two decimals (`85.00`). `revision` changes when, and only when, what the Learner did changes; `snapshotId` is a UUID v5 of the Organization, Learner, Course and revision; `asOf` is the time of the reading.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: learnerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: courseId
          in: path
          required: true
          description: The Course version, as in the other services.
          schema: { type: string, format: uuid }
        - name: organizationId
          in: query
          required: false
          description: Optional. Must equal the `x-organization-id` header when sent.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The snapshot, in `data` of the common envelope.
          content:
            application/json:
              schema:
                type: object
                required: [statusCode, message, data]
                properties:
                  statusCode: { type: integer, enum: [200] }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/CompletionSnapshot" }
        "400":
          description: learnerId or courseId is not a UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or wrong internal key, or a missing or malformed `x-organization-id`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The Organization of the query differs from the header.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/internal/learners/{learnerId}/courses/{courseId}/assessment-results:
    get:
      summary: The scores of the Quizzes and Assignments a Learner has done in a Course (UC28.1)
      description: |
        Called by learning-service to show a Learner their results against the passing scores. The caller sends `x-internal-key` and the identity headers of the Learner (`x-user-id`, `x-user-role`, `x-organization-id`); the `learnerId` in the path must equal `x-user-id`, otherwise the answer is 403, so one Learner cannot ask about another.

        Only the components the Learner has done something on are listed (a Quiz with an attempt, an Assignment with a submission); disabled ones are included and marked (BR-296). A Quiz attempt that ran out of time is submitted first, at its deadline (BR-200), so its score is there. Most recent activity first. Nothing is written except that submission of an attempt that was past its deadline.
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
        - name: learnerId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: courseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The results, in `data` of the common envelope. An empty `items` is a Learner who has done nothing.
          content:
            application/json:
              schema:
                type: object
                required: [statusCode, message, data]
                properties:
                  statusCode: { type: integer, enum: [200] }
                  message: { type: string }
                  data: { $ref: "#/components/schemas/AssessmentResults" }
        "400":
          description: learnerId or courseId is not a UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Missing or wrong internal key, or a missing or malformed `x-organization-id`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The Learner in the path is not the one in the identity headers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/assessments/organization/courses/{courseId}/review:
    get:
      operationId: getOrganizerAssessmentReview
      summary: UC21.2 - View Course Quiz and Assignment content
      description: >
        Organizer-only access to a Submitted Course in the same Organization.
        Includes Quiz answer keys, Assignment prompts, rubrics, and Peer Review
        settings. Course Service verifies eligibility before data is read.
      security:
        - BearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Course Assessment review content.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizerAssessmentsResponse" }
        "400": { description: Invalid Course UUID. }
        "401": { description: Authentication required. }
        "403": { description: Organizer role required. }
        "404": { description: Course not available for review. }
        "503": { description: Course Service unavailable. }

  /api/v1/assessments/organization/courses/{courseId}/assignments/{assignmentId}/prompt-file:
    get:
      operationId: downloadOrganizerAssignmentPrompt
      summary: UC21.2 - Download protected Assignment prompt attachment
      description: >
        Returns the original Assignment prompt file after Organizer authorization,
        Organization scoping, and Course eligibility verification.
      security:
        - BearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Assignment prompt attachment.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
            application/zip:
              schema: { type: string, format: binary }
        "400": { description: Invalid UUID. }
        "401": { description: Authentication required. }
        "403": { description: Organizer role required. }
        "404": { description: Course or attachment not found. }
        "503": { description: Course Service or storage unavailable. }

components:
  securitySchemes:
    InternalKey: { type: apiKey, in: header, name: x-internal-key }
    BearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    OrganizationId:
      name: x-organization-id
      in: header
      required: true
      schema: { type: string, format: uuid }
  schemas:
    AssessmentResults:
      type: object
      required: [courseId, items]
      properties:
        courseId: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: "#/components/schemas/AssessmentResultItem" }

    AssessmentResultItem:
      type: object
      required: [assessmentId, kind, title, isRequired, disabled, passingScore, status, recordedScore, passed, attemptCount, lastActivityAt, quiz, assignment]
      properties:
        assessmentId: { type: string, format: uuid }
        kind: { type: string, enum: [QUIZ, ASSIGNMENT] }
        title: { type: string }
        isRequired: { type: boolean, description: Every Assignment is required (BR-206); a Quiz only when its flag says so. }
        disabled: { type: boolean, description: "BR-296: the score stays but the component no longer counts for the Certificate." }
        passingScore: { type: number, minimum: 0, maximum: 100 }
        status: { type: string, enum: [InProgress, AwaitingResult, Completed] }
        recordedScore:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: Quiz, the best submitted attempt (BR-198). Assignment, the final score of the latest submission that was not replaced, only once Finalized (BR-212). Null while there is none.
        passed:
          type: boolean
          nullable: true
          description: recordedScore >= passingScore; null exactly when recordedScore is null (BR-191, never "failed").
        attemptCount: { type: integer, minimum: 0, description: Quiz, attempts submitted. Assignment, submissions made. }
        lastActivityAt: { type: string, format: date-time }
        quiz:
          nullable: true
          type: object
          required: [bestAttemptNumber, attempts]
          properties:
            bestAttemptNumber: { type: integer, nullable: true }
            attempts:
              type: array
              items:
                type: object
                required: [attemptNumber, score, submittedAt, submissionKind]
                properties:
                  attemptNumber: { type: integer }
                  score: { type: number, minimum: 0, maximum: 100 }
                  submittedAt: { type: string, format: date-time }
                  submissionKind: { type: string, nullable: true, description: "Manual, or TimedOut when the time ran out and the system submitted." }
        assignment:
          nullable: true
          type: object
          required: [latestSubmissionNumber, gradingStatus]
          properties:
            latestSubmissionNumber: { type: integer }
            gradingStatus: { type: string }
    Score:
      type: string
      description: Two decimals, no leading zero, 0.00 to 100.00.
      pattern: '^(?:0|[1-9]\d?)(?:\.\d{1,2})?$|^100(?:\.0{1,2})?$'
      example: "85.00"
    CompletionSnapshot:
      type: object
      additionalProperties: false
      required: [schemaVersion, snapshotId, asOf, revision, organizationId, learnerId, courseId, eligible, requiredComponentCount, quizzes, assignments]
      properties:
        schemaVersion: { type: integer, enum: [1] }
        snapshotId: { type: string, format: uuid }
        asOf: { type: string, format: date-time, description: UTC, ends in Z }
        revision: { type: string, minLength: 1 }
        organizationId: { type: string, format: uuid }
        learnerId: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        eligible: { type: boolean }
        requiredComponentCount:
          type: integer
          minimum: 0
          description: Equals the number of items in quizzes plus assignments.
        quizzes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [assessmentId, attemptId, recordedScore, passingScore, passed]
            properties:
              assessmentId: { type: string, format: uuid }
              attemptId: { type: string, format: uuid, nullable: true }
              recordedScore:
                nullable: true
                allOf: [{ $ref: "#/components/schemas/Score" }]
              passingScore: { $ref: "#/components/schemas/Score" }
              passed: { type: boolean }
        assignments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [assessmentId, submissionId, finalScore, passingScore, finalizedAt, passed, peerReview]
            properties:
              assessmentId: { type: string, format: uuid }
              submissionId: { type: string, format: uuid, nullable: true }
              finalScore:
                nullable: true
                allOf: [{ $ref: "#/components/schemas/Score" }]
              passingScore: { $ref: "#/components/schemas/Score" }
              finalizedAt: { type: string, format: date-time, nullable: true }
              passed: { type: boolean }
              peerReview:
                type: object
                additionalProperties: false
                required: [status, requiredCount, completedCount]
                properties:
                  status: { type: string, enum: [NotApplicable, Pending, Satisfied, Missed, Waived] }
                  requiredCount: { type: integer, minimum: 0, description: The reviews of the latest cycle in which the Learner has assignments. }
                  completedCount: { type: integer, minimum: 0, description: At most requiredCount; equals it when Satisfied; 0 when NotApplicable. }
    Error:
      type: object
      properties:
        statusCode: { type: integer }
        error:
          type: object
          properties:
            message: {}
            error: { type: string }
            statusCode: { type: integer }

    OrganizerReviewOption:
      type: object
      required: [id, position, content, isCorrect]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        content: { type: string }
        isCorrect: { type: boolean }

    OrganizerReviewQuestion:
      type: object
      required: [id, position, type, content, options]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        type: { type: string }
        content: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/OrganizerReviewOption" }

    OrganizerReviewRubric:
      type: object
      required: [id, name, description, maxPoints, position]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        maxPoints: { type: integer }
        position: { type: integer }

    OrganizerReviewAssessment:
      type: object
      required: [id, courseId, moduleId, kind, title, position, disabled, passingScore, isRequired, timeLimitMinutes, maxConsecutiveAttempts, lockoutHours, expectedDurationMinutes, prompt, promptFileName, peerReviewEnabled, peerReviewersPerSubmission, peerReviewCycleDays, peerReviewDeadlineDays, peerReviewScoreGap, questions, rubric]
      properties:
        id: { type: string, format: uuid }
        courseId: { type: string, format: uuid }
        moduleId: { type: string, format: uuid, nullable: true }
        kind: { type: string, enum: [QUIZ, ASSIGNMENT] }
        title: { type: string }
        position: { type: integer }
        disabled: { type: boolean }
        passingScore: { type: number }
        isRequired: { type: boolean }
        timeLimitMinutes: { type: integer, nullable: true }
        maxConsecutiveAttempts: { type: integer }
        lockoutHours: { type: integer }
        expectedDurationMinutes: { type: integer, nullable: true }
        prompt: { type: string, nullable: true }
        promptFileName: { type: string, nullable: true }
        peerReviewEnabled: { type: boolean }
        peerReviewersPerSubmission: { type: integer, nullable: true }
        peerReviewCycleDays: { type: integer, nullable: true }
        peerReviewDeadlineDays: { type: integer, nullable: true }
        peerReviewScoreGap: { type: number, nullable: true }
        questions:
          type: array
          items: { $ref: "#/components/schemas/OrganizerReviewQuestion" }
        rubric:
          type: array
          items: { $ref: "#/components/schemas/OrganizerReviewRubric" }

    OrganizerAssessmentsResponse:
      type: object
      required: [statusCode, message, data]
      properties:
        statusCode: { type: integer, enum: [200] }
        message: { type: string }
        data:
          type: object
          required: [courseId, items]
          properties:
            courseId: { type: string, format: uuid }
            items:
              type: array
              items: { $ref: "#/components/schemas/OrganizerReviewAssessment" }
