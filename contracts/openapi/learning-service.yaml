openapi: 3.0.3
info:
  title: LearnUP Learning access API
  version: 1.0.0
  description: Currently includes only L17 assessment-access and enrollment course-ids. Course IDs identify Course versions, not chains. BR-210, BR-211, BR-147, BR-307, BR-160, BR-163 apply; ongoing attempts and peer reviews remain assessment-service responsibilities.
security:
  - InternalKey: []
paths:
  /api/v1/internal/enrollments/assessment-access:
    get:
      summary: Resolve assessment access using stored enrollment status
      description: No additional role restriction. Organization comes from the trusted header. Missing or foreign-organization Enrollment returns the same 404. Overdue is never stored or returned; past-due NotStarted/InProgress retain Full access. Unknown stored status returns 500 and is logged. Unknown or repeated query parameters are rejected.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/UserRole"
        - name: learnerId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: courseId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Full for NotStarted/InProgress/Exempted; ReadOnly for Completed; None for Halted/Withdrawn.
          content:
            application/json:
              schema:
                type: object
                required: [statusCode, message, data]
                properties:
                  statusCode: { type: integer, enum: [200] }
                  message: { type: string }
                  data:
                    type: object
                    required: [enrollmentId, status, access]
                    properties:
                      enrollmentId: { type: string, format: uuid }
                      status: { $ref: "#/components/schemas/Status" }
                      access: { type: string, enum: [Full, ReadOnly, None] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: error.code is ENROLLMENT_NOT_FOUND
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: error.code is VALIDATION_ERROR; missing, empty, malformed UUID, repeated or unknown query parameter.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: Invalid stored status; error.code is INVALID_ENROLLMENT_STATUS.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/enrollments/me/course-ids:
    get:
      summary: List own enrolled Course versions with stored status
      description: LEARNER role required. Restricted to authenticated learner and organization, excludes Withdrawn, sorted by courseId ascending. Does not compute Overdue.
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/OrganizationId"
        - $ref: "#/components/parameters/UserRole"
      responses:
        "200":
          description: Enrollment references
          content:
            application/json:
              schema:
                type: object
                required: [statusCode, message, data]
                properties:
                  statusCode: { type: integer, enum: [200] }
                  message: { type: string }
                  data:
                    type: array
                    items:
                      type: object
                      required: [courseId, enrollmentId, status]
                      properties:
                        courseId: { type: string, format: uuid }
                        enrollmentId: { type: string, format: uuid }
                        status: { $ref: "#/components/schemas/Status" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role is not LEARNER
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    InternalKey: { type: apiKey, in: header, name: x-internal-key }
  parameters:
    UserId:
      name: x-user-id
      in: header
      required: true
      schema: { type: string }
    OrganizationId:
      name: x-organization-id
      in: header
      required: true
      schema: { type: string, format: uuid }
    UserRole:
      name: x-user-role
      in: header
      required: true
      description: A role recognized by the existing InternalAuthGuard. L17 imposes no additional role restriction.
      schema: { type: string }
  responses:
    Unauthorized:
      description: Missing or invalid internal key or authenticated context. T3 preserved; no business code.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Status:
      type: string
      enum: [NotStarted, InProgress, Completed, Exempted, Withdrawn, Halted]
    Error:
      type: object
      required: [statusCode, timestamp, path, error]
      properties:
        statusCode: { type: integer }
        timestamp: { type: string, format: date-time }
        path: { type: string }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            statusCode: { type: integer }
            error: { type: string }
