openapi: 3.0.3
info:
  title: LearnUP Common Headers Contract
  version: 1.0.0
  description: Standard internal and external HTTP header parameters for the LearnUP platform.

components:
  headers:
    X-User-ID:
      description: The authenticated subject/user identifier derived from trusted JWT claims by Spring Cloud Gateway.
      schema:
        type: string
        example: "usr_01HGB98A76B5F4E3D2C1"
      required: true

    X-Organization-ID:
      description: The active tenant organization identifier derived from trusted JWT claims by Spring Cloud Gateway.
      schema:
        type: string
        example: "org_01HGB7398A1B2C3D4E5"
      required: true

    X-Correlation-ID:
      description: Unique trace correlation identifier propagated across HTTP requests and Kafka events.
      schema:
        type: string
        format: uuid
        example: "c7a31b20-1e82-4f11-9a70-8b77a942001e"
      required: true

  parameters:
    HeaderUserId:
      name: X-User-ID
      in: header
      required: false
      description: Injected by API Gateway from validated JWT. Internal use only.
      schema:
        type: string
    
    HeaderOrganizationId:
      name: X-Organization-ID
      in: header
      required: false
      description: Injected by API Gateway from validated JWT. Internal use only.
      schema:
        type: string

    HeaderCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Ingress trace correlation token.
      schema:
        type: string
        format: uuid
