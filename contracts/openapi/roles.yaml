openapi: 3.0.3
info:
  title: LearnUP Canonical Roles Contract
  version: 1.0.0
  description: Canonical platform roles for RBAC and authorization.

components:
  schemas:
    PlatformRole:
      type: string
      description: Canonical role assigned to a user governing platform authorization and permissions.
      enum:
        - ADMIN
        - ORGANIZER
        - INSTRUCTOR
        - LEARNER
      example: "ORGANIZER"
