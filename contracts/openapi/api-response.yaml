openapi: 3.0.3
info:
  title: LearnUP Standard API Response Envelope
  version: 1.0.0
  description: Universal success and error envelope returned by all LearnUP REST endpoints.

components:
  schemas:
    ApiResponse:
      type: object
      required:
        - success
        - timestamp
      properties:
        success:
          type: boolean
          description: Indicates if the request completed successfully.
          example: true
        data:
          description: Payload data for successful requests. Null on failure.
          nullable: true
        meta:
          $ref: "./pagination.yaml#/components/schemas/PageMeta"
          nullable: true
          description: Optional metadata for paginated results or query statistics.
        error:
          $ref: "./api-error.yaml#/components/schemas/ApiError"
          nullable: true
          description: Error details if success is false. Null on success.
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 UTC timestamp of response generation.
          example: "2026-09-12T10:00:00.000Z"
