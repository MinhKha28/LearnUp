openapi: 3.0.3
info:
  title: LearnUP JWT Claims Contract
  version: 1.0.0
  description: JWT claims structure issued by Identity Service and validated by API Gateway.

components:
  schemas:
    JwtClaims:
      type: object
      description: Cryptographic claims payload contained in validated LearnUP JWT bearer tokens.
      required:
        - sub
        - role
        - organizationId
        - iat
        - exp
      properties:
        sub:
          type: string
          description: Unique User ID identifier.
          example: "usr_01HGB98A76B5F4E3D2C1"
        role:
          $ref: "./roles.yaml#/components/schemas/PlatformRole"
        organizationId:
          type: string
          description: Standardized tenant organization identifier.
          example: "org_01HGB7398A1B2C3D4E5"
        iat:
          type: integer
          description: Timestamp in seconds indicating when the JWT was issued.
          example: 1726113600
        exp:
          type: integer
          description: Timestamp in seconds indicating when the JWT expires.
          example: 1726117200
        iss:
          type: string
          description: Issuer identity string.
          example: "learnup-identity-service"
        aud:
          type: string
          description: Audience target string.
          example: "learnup-platform"
