openapi: 3.0.3
info:
  title: LearnUP Pagination Contract
  version: 1.0.0
  description: Offset/Page-based query parameters and pagination metadata schema for MVP.

components:
  parameters:
    PageQueryParam:
      name: page
      in: query
      required: false
      description: Zero-based page index (0..N). Default is 0.
      schema:
        type: integer
        minimum: 0
        default: 0
        example: 0

    SizeQueryParam:
      name: size
      in: query
      required: false
      description: Number of records per page (1..100). Default is 20.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20

    SortQueryParam:
      name: sort
      in: query
      required: false
      description: Sorting criteria in the format `property,(asc|desc)`. Default direction is asc.
      schema:
        type: string
        example: "createdAt,desc"

  schemas:
    PageMeta:
      type: object
      required:
        - page
        - size
        - totalElements
        - totalPages
        - hasNext
        - hasPrevious
      properties:
        page:
          type: integer
          description: Current zero-based page index.
          example: 0
        size:
          type: integer
          description: Number of records per page.
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Total number of records across all pages.
          example: 142
        totalPages:
          type: integer
          description: Total number of pages.
          example: 8
        hasNext:
          type: boolean
          description: True if a subsequent page exists.
          example: true
        hasPrevious:
          type: boolean
          description: True if a preceding page exists.
          example: false
