openapi: 3.0.3
info:
  title: LearnUP Error Code Catalog Contract
  version: 1.0.0
  description: Platform-wide machine-readable error codes.

components:
  schemas:
    ErrorCode:
      type: string
      description: Platform standard machine-readable error codes.
      enum:
        - INVALID_INPUT
        - UNAUTHORIZED
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      example: "RESOURCE_NOT_FOUND"
