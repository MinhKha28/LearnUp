openapi: 3.0.3
info:
  title: LearnUP Standard API Error Contract
  version: 1.0.0
  description: Structured error model for all 4xx and 5xx responses.

components:
  schemas:
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: "./error-codes.yaml#/components/schemas/ErrorCode"
        message:
          type: string
          description: Human-readable error description.
          example: "The requested resource could not be found."
        details:
          type: array
          description: Granular field-level validation errors or context issues.
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
        correlationId:
          type: string
          format: uuid
          description: Active correlation ID associated with the error occurrence.
          example: "c7a31b20-1e82-4f11-9a70-8b77a942001e"
          nullable: true

    ErrorDetail:
      type: object
      required:
        - field
        - issue
      properties:
        field:
          type: string
          description: The property or parameter path that caused the error.
          example: "organizationId"
        issue:
          type: string
          description: Detailed explanation of the validation failure.
          example: "Must be a valid non-empty organization identifier."
