server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      routes:
        # Supporting: Identity Service Routes (Eureka lb://)
        - id: identity-service-auth
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/v1/auth/**, /api/auth/**

        # Supporting: Notification Service Routes (Eureka lb://)
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/v1/notifications/**, /api/notifications/**

        # Supporting: Audit Service Routes (Eureka lb://)
        - id: audit-service
          uri: lb://AUDIT-SERVICE
          predicates:
            - Path=/api/v1/audit/**, /api/audit/**

        # Business 1: Tenant Service Routes (Docker DNS)
        - id: tenant-service
          uri: ${TENANT_SERVICE_URL:http://tenant-service:8084}
          predicates:
            - Path=/api/v1/users/**, /api/v1/organizations/**, /api/v1/subscriptions/**, /api/v1/subscription-plans/**, /api/v1/registrations/**, /api/v1/invitations/**, /api/v1/payments/**, /api/users/**, /api/organizations/**, /api/subscriptions/**, /api/subscription-plans/**, /api/registrations/**, /api/invitations/**, /api/payments/**

        # Business 2: Course Service Routes (Docker DNS)
        - id: course-service
          uri: ${COURSE_SERVICE_URL:http://course-service:8083}
          predicates:
            - Path=/api/v1/courses/**, /api/courses/**

        # Business 3: Learning Service Routes (Docker DNS)
        - id: learning-service
          uri: ${LEARNING_SERVICE_URL:http://learning-service:8085}
          predicates:
            - Path=/api/v1/learning/**, /api/v1/enrollments/**, /api/learning/**, /api/enrollments/**

        # Business 4: Assessment Service Routes (Docker DNS)
        - id: assessment-service
          uri: ${ASSESSMENT_SERVICE_URL:http://assessment-service:8086}
          predicates:
            - Path=/api/v1/assessments/**, /api/assessments/**

        # Business 5: Achievement & Reporting Service Routes (Docker DNS)
        - id: achievement-reporting-service
          uri: ${ACHIEVEMENT_REPORTING_SERVICE_URL:http://achievement-reporting-service:8087}
          predicates:
            - Path=/api/v1/certificates/**, /api/v1/reports/**, /api/v1/governance/**, /api/certificates/**, /api/reports/**, /api/governance/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:devSecretKeyForLearnUpPlatformMustBeAtLeast32BytesLong}
  internal-key: ${INTERNAL_GATEWAY_KEY:learnup-internal-secret}
  whitelist:
    - /api/v1/auth/login
    - /api/v1/auth/refresh
    - /api/v1/auth/forgot-password
    - /api/v1/auth/reset-password
    - /api/v1/subscription-plans/**
    - /api/v1/registrations/**
    - /api/v1/invitations/**
    - /api/v1/certificates/verify/**
    - /api/auth/login
    - /api/auth/refresh
    - /api/auth/forgot-password
    - /api/auth/reset-password
    - /api/subscription-plans/**
    - /api/registrations/**
    - /api/invitations/**
    - /api/certificates/verify/**
    - /actuator/health
    - /fallback/**

gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.learnup.gateway: INFO
    org.springframework.cloud.gateway: INFO

---
spring:
  config:
    activate:
      on-profile: docker

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
