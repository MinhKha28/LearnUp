server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # Supporting: Identity Service Routes
        - id: identity-service-auth
          uri: lb://IDENTITY-SERVICE
          predicates:
            - Path=/api/auth/**

        # Supporting: Notification Service Routes
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**

        # Supporting: Audit Service Routes
        - id: audit-service
          uri: lb://AUDIT-SERVICE
          predicates:
            - Path=/api/audit/**

        # Business 1: Tenant Service Routes
        - id: tenant-service
          uri: lb://TENANT-SERVICE
          predicates:
            - Path=/api/users/**, /api/organizations/**, /api/subscriptions/**, /api/payments/**

        # Business 2: Course Service Routes
        - id: course-service
          uri: lb://COURSE-SERVICE
          predicates:
            - Path=/api/courses/**

        # Business 3: Learning Service Routes
        - id: learning-service
          uri: lb://LEARNING-SERVICE
          predicates:
            - Path=/api/learning/**

        # Business 4: Assessment Service Routes
        - id: assessment-service
          uri: lb://ASSESSMENT-SERVICE
          predicates:
            - Path=/api/assessments/**

        # Business 5: Achievement & Reporting Service Routes
        - id: achievement-reporting-service
          uri: lb://ACHIEVEMENT-REPORTING-SERVICE
          predicates:
            - Path=/api/certificates/**, /api/reports/**, /api/governance/**

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:devSecretKeyForLearnUpPlatformMustBeAtLeast32BytesLong}
  whitelist:
    - /api/auth/login
    - /api/auth/register
    - /api/auth/refresh
    - /api/certificates/verify/**
    - /actuator/health
    - /fallback/**


gateway:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized


logging:
  level:
    com.learnup.gateway: INFO
    org.springframework.cloud.gateway: INFO

---
spring:
  config:
    activate:
      on-profile: docker

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
