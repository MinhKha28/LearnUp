# Classify the original URI, not $uri, which changes during the SPA fallback.
# Encoded route letters/slashes must not bypass recovery-secret redaction.
map $request_uri $recovery_safe_request {
    default $request;
    ~*^(?:/|%2f)+(?:r|%[57]2)(?:e|%[46]5)(?:s|%[57]3)(?:e|%[46]5)(?:t|%[57]4)(?:-|%2d)(?:p|%[57]0)(?:a|%[46]1)(?:s|%[57]3)(?:s|%[57]3)(?:w|%[57]7)(?:o|%[46]f)(?:r|%[57]2)(?:d|%[46]4)(?:/|%2f|\?|$) "$request_method /reset-password/[redacted] $server_protocol";
}

map $http_referer $recovery_safe_referer {
    default $http_referer;
    "" "-";
    ~*(?:^|/|%2f)(?:r|%[57]2)(?:e|%[46]5)(?:s|%[57]3)(?:e|%[46]5)(?:t|%[57]4)(?:-|%2d)(?:p|%[57]0)(?:a|%[46]1)(?:s|%[57]3)(?:s|%[57]3)(?:w|%[57]7)(?:o|%[46]f)(?:r|%[57]2)(?:d|%[46]4)(?:/|%2f|\?|$) "[redacted-password-recovery]";
}

log_format recovery_safe_combined '$remote_addr - $remote_user [$time_local] '
    '"$recovery_safe_request" $status $body_bytes_sent '
    '"$recovery_safe_referer" "$http_user_agent"';

server {
    listen 3000;
    server_name localhost;
    access_log /var/log/nginx/access.log recovery_safe_combined;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
