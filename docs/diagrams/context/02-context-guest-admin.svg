<text x="395" y="257" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Registration record in Pending Payment status</text>
<text x="395" y="272" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Payment result</text>
<text x="395" y="287" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Email verification result</text>
