<text x="700" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Figure 6 - Context diagram: the four external systems seen from LearnUP</text>
<text x="700" y="60" text-anchor="middle" font-size="13" fill="#555">What LearnUP exchanges with each external system, and how many use cases depend on it</text>
<rect x="580" y="90" width="240" height="270" rx="22" fill="#E3F5EC" stroke="#1F8A5B" stroke-width="3"/>
<text x="700" y="207" text-anchor="middle" font-size="26" font-weight="800" fill="#0F5233">LearnUP</text>
<text x="700" y="233" text-anchor="middle" font-size="13" fill="#0F5233">B2B multi-tenant online learning</text>
<text x="700" y="251" text-anchor="middle" font-size="13" fill="#0F5233">and corporate training platform</text>
<text x="700" y="277" text-anchor="middle" font-size="11" fill="#0F5233" opacity="0.8">system boundary</text>
<rect x="20" y="132" width="190" height="76" rx="6" fill="#FFF1DE" stroke="#D9822B" stroke-width="2"/>
<text x="115" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#7A4208">Email Service</text>
<text x="115" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#7A4208">(32 use cases)</text>
<text x="115" y="198" text-anchor="middle" font-size="11" fill="#7A4208" opacity="0.8">external system</text>
<text x="395" y="119" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Account invitation, re-invitation and bulk import</text>
<text x="395" y="134" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">   emails</text>
<text x="395" y="149" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Registration, verification and password recovery links</text>
<text x="395" y="164" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Course approval, version and ownership notices</text>
<text x="395" y="179" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Training assignment and due date notices</text>
<text x="395" y="194" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Grade, exemption, report, suspension notices</text>
<line x1="574" y1="204" x2="216" y2="204" stroke="#1F8A5B" stroke-width="2" marker-end="url(#a1F8A5B)"/>
<rect x="20" y="267" width="190" height="76" rx="6" fill="#FFF1DE" stroke="#D9822B" stroke-width="2"/>
<text x="115" y="293" text-anchor="middle" font-size="15" font-weight="700" fill="#7A4208">Mock Payment Service</text>
<text x="115" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#7A4208">(4 use cases)</text>
<text x="115" y="333" text-anchor="middle" font-size="11" fill="#7A4208" opacity="0.8">external system</text>
<text x="395" y="284" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Payment result</text>
<line x1="216" y1="294" x2="574" y2="294" stroke="#2F6FD1" stroke-width="2" marker-end="url(#a2F6FD1)"/>
<text x="395" y="317" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Payment request (register, retry, renew, upgrade)</text>
<line x1="574" y1="327" x2="216" y2="327" stroke="#1F8A5B" stroke-width="2" marker-end="url(#a1F8A5B)"/>
<rect x="1190" y="132" width="190" height="76" rx="6" fill="#FFF1DE" stroke="#D9822B" stroke-width="2"/>
<text x="1285" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#7A4208">Media Storage Service</text>
<text x="1285" y="175" text-anchor="middle" font-size="15" font-weight="700" fill="#7A4208">(20 use cases)</text>
<text x="1285" y="198" text-anchor="middle" font-size="11" fill="#7A4208" opacity="0.8">external system</text>
<text x="1005" y="119" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Stored file reference</text>
<text x="1005" y="134" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• File stream or download</text>
