<text x="1005" y="167" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Profile avatar, organization logo, Course cover</text>
<text x="1005" y="182" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Video and reading materials</text>
<text x="1005" y="197" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Assignment prompt and submission files</text>
<text x="1005" y="212" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Certificate PDF and exported reports</text>
