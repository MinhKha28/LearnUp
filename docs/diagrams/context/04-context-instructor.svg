<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 450" width="1400" height="450" font-family="Calibri, Arial, sans-serif">
<defs><marker id="a2F6FD1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6FD1"/></marker><marker id="a1F8A5B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F8A5B"/></marker></defs>
<rect width="1400" height="450" fill="#ffffff"/>
<text x="700" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Figure 4 - Context diagram: Instructor</text>
<text x="700" y="60" text-anchor="middle" font-size="13" fill="#555">Features: Course, Curriculum, Learning Material, Assessment, Course Versioning, Grading, Reporting, Moderation</text>
<rect x="580" y="90" width="240" height="290" rx="22" fill="#E3F5EC" stroke="#1F8A5B" stroke-width="3"/>
<text x="700" y="217" text-anchor="middle" font-size="26" font-weight="800" fill="#0F5233">LearnUP</text>
<text x="700" y="243" text-anchor="middle" font-size="13" fill="#0F5233">B2B multi-tenant online learning</text>
<text x="700" y="261" text-anchor="middle" font-size="13" fill="#0F5233">and corporate training platform</text>
<text x="700" y="287" text-anchor="middle" font-size="11" fill="#0F5233" opacity="0.8">system boundary</text>
<rect x="20" y="197" width="190" height="76" rx="6" fill="#E6F0FF" stroke="#2F6FD1" stroke-width="2"/>
<text x="115" y="237" text-anchor="middle" font-size="15" font-weight="700" fill="#123A7A">Instructor</text>
<text x="115" y="263" text-anchor="middle" font-size="11" fill="#123A7A" opacity="0.8">external actor</text>
<text x="395" y="124" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Course information and cover image</text>
<text x="395" y="139" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Modules, lessons and lesson content</text>
<text x="395" y="154" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Video and reading materials</text>
<text x="395" y="169" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Quizzes and questions</text>
<text x="395" y="184" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Assignments, Rubric and Peer Review settings</text>
<text x="395" y="199" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Submit or withdraw a Course, create a new version,</text>
<text x="395" y="214" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">   release old assets</text>
<text x="395" y="229" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Grades, final results, peer review exemption,</text>
<text x="395" y="244" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">   reconsideration request</text>
<line x1="216" y1="254" x2="574" y2="254" stroke="#2F6FD1" stroke-width="2" marker-end="url(#a2F6FD1)"/>
<text x="395" y="277" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Assigned Courses and curriculum structure</text>
<text x="395" y="292" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Version chain</text>
<text x="395" y="307" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Submissions to grade and peer review cycles</text>
<text x="395" y="322" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Course reports and evaluation results</text>
<text x="395" y="337" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Notifications</text>
<line x1="574" y1="347" x2="216" y2="347" stroke="#1F8A5B" stroke-width="2" marker-end="url(#a1F8A5B)"/>
<rect x="1190" y="124.5" width="190" height="76" rx="6" fill="#FFF1DE" stroke="#D9822B" stroke-width="2"/>
<text x="1285" y="164.5" text-anchor="middle" font-size="15" font-weight="700" fill="#7A4208">Email Service</text>
<text x="1285" y="190.5" text-anchor="middle" font-size="11" fill="#7A4208" opacity="0.8">external system</text>
<text x="1005" y="119" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Notice to Organizer when a Course is submitted or</text>
<text x="1005" y="134" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">   withdrawn</text>
<text x="1005" y="149" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• New version and reconsideration notices</text>
<text x="1005" y="164" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Final grade notice to Learner</text>
<text x="1005" y="179" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Peer review exemption notice</text>
<line x1="826" y1="189" x2="1184" y2="189" stroke="#1F8A5B" stroke-width="2" marker-end="url(#a1F8A5B)"/>
<rect x="1190" y="269.5" width="190" height="76" rx="6" fill="#FFF1DE" stroke="#D9822B" stroke-width="2"/>
<text x="1285" y="309.5" text-anchor="middle" font-size="15" font-weight="700" fill="#7A4208">Media Storage Service</text>
<text x="1285" y="335.5" text-anchor="middle" font-size="11" fill="#7A4208" opacity="0.8">external system</text>
<text x="1005" y="264" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Stored file reference</text>
<text x="1005" y="279" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Learner submission file to view</text>
<line x1="1184" y1="289" x2="826" y2="289" stroke="#2F6FD1" stroke-width="2" marker-end="url(#a2F6FD1)"/>
<text x="1005" y="312" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Course cover, video and reading files</text>
<text x="1005" y="327" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Assignment prompt file</text>
<text x="1005" y="342" text-anchor="middle" font-size="12" fill="#222" xml:space="preserve">• Exported course report</text>
<line x1="826" y1="352" x2="1184" y2="352" stroke="#1F8A5B" stroke-width="2" marker-end="url(#a1F8A5B)"/>
<line x1="40" y1="414" x2="90" y2="414" stroke="#2F6FD1" stroke-width="2" marker-end="url(#a2F6FD1)"/>
<text x="98" y="418" font-size="12" fill="#222">data sent to LearnUP</text>
<line x1="250" y1="414" x2="300" y2="414" stroke="#1F8A5B" stroke-width="2" marker-end="url(#a1F8A5B)"/>
<text x="308" y="418" font-size="12" fill="#222">data sent by LearnUP</text>
<text x="1380" y="418" text-anchor="end" font-size="11" font-style="italic" fill="#555">UC-14 to UC-20.1, UC-22 to UC-22.2, UC-32 to UC-33.2, UC-36, UC-39, UC-48</text>
</svg>