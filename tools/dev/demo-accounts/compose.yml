name: learnup-demo-${DEMO_TARGET:?Select a unique disposable target}

x-fixture: &fixture
  labels:
    com.learnup.demo-fixture: ${DEMO_TARGET}
  networks: [fixture]
  restart: "no"

x-java: &java
  SPRING_PROFILES_ACTIVE: development
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
  JAVA_TOOL_OPTIONS: -Xmx256m

x-db: &db
  SPRING_DATASOURCE_USERNAME: fixture
  SPRING_DATASOURCE_PASSWORD: ${DEMO_DB_PASSWORD:?Supply a disposable database password}

x-auth: &auth
  JWT_SECRET: ${DEMO_JWT_SECRET:?Supply a private random JWT secret}
  INTERNAL_SERVICE_KEY: ${DEMO_INTERNAL_KEY:?Supply a private random internal key}

services:
  postgres:
    <<: *fixture
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fixture
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD}
    tmpfs: [/var/lib/postgresql/data]
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/fixture.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fixture]
      interval: 2s
      retries: 30

  smtp:
    <<: *fixture
    networks: [fixture, ingress]
    image: axllent/mailpit:v1.27.4
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    tmpfs: [/data]
    ports: ["127.0.0.1:${DEMO_MAILPIT_PORT:-18025}:8025"]

  eureka-server:
    <<: *fixture
    build:
      context: ../../../infrastructure/eureka-server
    environment:
      <<: *java

  api-gateway:
    <<: *fixture
    networks: [fixture, ingress]
    build:
      context: ../../..
      dockerfile: gateway/api-gateway/Dockerfile
    environment:
      <<: [*java, *auth]
      TENANT_SERVICE_URL: http://tenant-service:8084
    ports: ["127.0.0.1:${DEMO_GATEWAY_PORT:-18088}:8080"]

  identity-service:
    <<: *fixture
    build:
      context: ../../..
      dockerfile: services/identity-service/Dockerfile
    environment:
      <<: [*java, *db, *auth]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/learnup_demo_identity
      TENANT_SERVICE_URL: http://tenant-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
      PASSWORD_RECOVERY_FRONTEND_BASE_URL: ${DEMO_FRONTEND_URL:?Supply the local frontend origin}
      LEARNUP_SEED_ENABLED: "false"
    depends_on:
      postgres: {condition: service_healthy}

  notification-service:
    <<: *fixture
    build:
      context: ../../..
      dockerfile: services/notification-service/Dockerfile
    environment:
      <<: [*java, *db]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/learnup_demo_notification
      INTERNAL_SERVICE_KEY: ${DEMO_INTERNAL_KEY}
      LEARNUP_MAIL_ENABLED: "true"
      LEARNUP_MAIL_FROM: noreply@demo.learnup.test
      SPRING_MAIL_HOST: smtp
      SPRING_MAIL_PORT: "1025"
      SPRING_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_SMTP_STARTTLS_ENABLE: "false"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    depends_on:
      postgres: {condition: service_healthy}

  tenant-service:
    <<: *fixture
    build:
      context: ../../..
      dockerfile: services/tenant-service/Dockerfile
    environment:
      NODE_ENV: development
      PORT: "8084"
      DEV_FAKE_AUTH: "false"
      DATABASE_URL: postgresql://fixture:${DEMO_DB_PASSWORD}@postgres:5432/learnup_demo_tenant
      INTERNAL_SERVICE_KEY: ${DEMO_INTERNAL_KEY}
      EMAIL_OTP_SECRET: ${DEMO_OTP_SECRET:?Supply a private random OTP secret}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
      FRONTEND_URL: ${DEMO_FRONTEND_URL}
    depends_on:
      postgres: {condition: service_healthy}

networks:
  fixture:
    internal: true
    labels:
      com.learnup.demo-fixture: ${DEMO_TARGET}
  ingress:
    labels:
      com.learnup.demo-fixture: ${DEMO_TARGET}
