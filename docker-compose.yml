services:
  # ==============================================================================
  # Database Infrastructure
  # PostgreSQL instance hosting logical database per service
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: learnup-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: identity_db
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - learnup-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # Message Broker Infrastructure
  # Apache Kafka in KRaft mode (no Zookeeper required)
  # ==============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: learnup-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - learnup-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==============================================================================
  # Service Discovery Server
  # Netflix Eureka Server
  # ==============================================================================
  eureka-server:
    build:
      context: ./infrastructure/eureka-server
      dockerfile: Dockerfile
    container_name: learnup-eureka
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - learnup-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8761/eureka/apps || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # API Gateway
  # Spring Cloud Gateway
  # ==============================================================================
  api-gateway:
    build:
      context: .
      dockerfile: gateway/api-gateway/Dockerfile
    container_name: learnup-gateway
    ports:
      - "${GATEWAY_HOST_PORT:-8088}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Set a private random JWT_SECRET of at least 32 bytes}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set a private random INTERNAL_SERVICE_KEY of at least 32 bytes}
      TENANT_SERVICE_URL: http://tenant-service:8084
      COURSE_SERVICE_URL: http://course-service:8083
      LEARNING_SERVICE_URL: http://learning-service:8085
      ASSESSMENT_SERVICE_URL: http://assessment-service:8086
      ACHIEVEMENT_REPORTING_SERVICE_URL: http://achievement-reporting-service:8087
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - learnup-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8080/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # Supporting Platform Services
  # ==============================================================================
  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: learnup-identity-service
    # Internal only: Gateway discovers :8081 through Eureka; Tenant uses identity-service:8081.
    # Development host debugging, if needed: opt in with a local override bound to 127.0.0.1.
    expose:
      - "8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:?Set a private random JWT_SECRET of at least 32 bytes}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Set a private random INTERNAL_SERVICE_KEY of at least 32 bytes}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      TENANT_SERVICE_URL: http://tenant-service:8084
      LEARNUP_SEED_ENABLED: ${LEARNUP_SEED_ENABLED:-true}
      LEARNUP_SEED_DEFAULT_PASSWORD: ${LEARNUP_SEED_DEFAULT_PASSWORD:-LearnUp@123}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - learnup-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8081/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: learnup-notification-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      LEARNUP_MAIL_ENABLED: ${LEARNUP_MAIL_ENABLED:-false}
      LEARNUP_MAIL_FROM: ${LEARNUP_MAIL_FROM:-noreply@learnup.com}
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - learnup-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8082/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    container_name: learnup-audit-service
    ports:
      - "8093:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audit_db
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - learnup-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:8083/actuator/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # Business Services
  # ==============================================================================
  tenant-service:
    build:
      context: .
      dockerfile: services/tenant-service/Dockerfile
    container_name: learnup-tenant-service
    ports:
      - "8084:8084"
    environment:
      PORT: 8084
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/tenant_db?schema=public
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-learnup-internal-secret}
      FRONTEND_URL: http://localhost:3000
      IDENTITY_SERVICE_URL: http://identity-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
      COURSE_SERVICE_URL: http://course-service:8083
      COURSE_SERVICE_TIMEOUT_MS: 3000
      LEARNING_SERVICE_URL: http://learning-service:8085
      LEARNING_SERVICE_TIMEOUT_MS: 3000
      EMAIL_OTP_SECRET: ${EMAIL_OTP_SECRET:-devEmailOtpSecretMustBe32BytesLong123456}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - learnup-network

  course-service:
    build:
      context: .
      dockerfile: services/course-service/Dockerfile
    container_name: learnup-course-service
    ports:
      - "8089:8083"
    environment:
      PORT: 8083
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/course_db?schema=public
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-learnup-internal-secret}
      TENANT_SERVICE_URL: http://tenant-service:8084
      LEARNING_SERVICE_URL: http://learning-service:8085
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - learnup-network

  learning-service:
    build:
      context: .
      dockerfile: services/learning-service/Dockerfile
    container_name: learnup-learning-service
    ports:
      - "8085:8085"
    environment:
      PORT: 8085
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/learning_db?schema=public
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-learnup-internal-secret}
      COURSE_SERVICE_URL: http://course-service:8083
      COURSE_SERVICE_TIMEOUT_MS: 3000
      TENANT_SERVICE_URL: http://tenant-service:8084
      TENANT_CLIENT_MODE: fake
      TENANT_FAKE_TIMEZONE: Asia/Ho_Chi_Minh
      ASSESSMENT_CLIENT_MODE: http
      ASSESSMENT_SERVICE_URL: http://assessment-service:8086
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - learnup-network

  assessment-service:
    build:
      context: .
      dockerfile: services/assessment-service/Dockerfile
    container_name: learnup-assessment-service
    ports:
      - "8086:8086"
    environment:
      PORT: 8086
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/assessment_db?schema=public
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-learnup-internal-secret}
      COURSE_SERVICE_URL: http://course-service:8083
      COURSE_SERVICE_TIMEOUT_MS: 5000
      TENANT_SERVICE_URL: http://tenant-service:8084
      LEARNING_SERVICE_URL: http://learning-service:8085
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - learnup-network

  achievement-reporting-service:
    build:
      context: .
      dockerfile: services/achievement-reporting-service/Dockerfile
    container_name: learnup-achievement-reporting-service
    ports:
      - "8087:8087"
    environment:
      PORT: 8087
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/achievement_reporting_db?schema=public
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-learnup-internal-secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - learnup-network

  # ==============================================================================
  # Frontend Application
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:${GATEWAY_HOST_PORT:-8088}
        VITE_TENANT_BACKEND_URL: http://localhost:${GATEWAY_HOST_PORT:-8088}
        VITE_COURSE_BACKEND_URL: http://localhost:${GATEWAY_HOST_PORT:-8088}
        VITE_ASSESSMENT_BACKEND_URL: http://localhost:${GATEWAY_HOST_PORT:-8088}
    container_name: learnup-web
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - learnup-network

networks:
  learnup-network:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
