# ==============================================================================
# LearnUP Eureka Discovery Server - Base Configuration
# ==============================================================================
server:
  port: ${SERVER_PORT:8761}
  shutdown: graceful

spring:
  application:
    name: eureka-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Management & Health Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: "LearnUP Eureka Discovery Server"
    description: "Dynamic Service Registry & Discovery Engine"
    version: "1.0.0-SNAPSHOT"
