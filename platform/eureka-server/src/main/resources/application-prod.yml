# ==============================================================================
# LearnUP Eureka Server - Production High-Availability Profile (prod)
# ==============================================================================
eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:eureka-server}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    # In production multi-node clusters, register with peer nodes
    register-with-eureka: ${EUREKA_REGISTER_WITH_PEER:false}
    fetch-registry: ${EUREKA_FETCH_REGISTRY_PEER:false}
    service-url:
      defaultZone: ${EUREKA_PEER_SERVICE_URLS:http://${eureka.instance.hostname}:${server.port}/eureka/}
  server:
    # Keep self-preservation enabled in production to protect against transient network partitions
    enable-self-preservation: true
    renewal-percent-threshold: 0.85
    eviction-interval-timer-in-ms: 60000
    response-cache-update-interval-ms: 30000

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSZ}","level":"%p","service":"eureka-server","thread":"%t","logger":"%c","message":"%m"}%n'
  level:
    root: WARN
    com.learnup.eureka: INFO
    org.springframework.cloud.netflix.eureka: INFO
    com.netflix.eureka: WARN
