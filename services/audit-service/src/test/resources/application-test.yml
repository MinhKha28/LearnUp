spring:
  datasource:
    url: jdbc:h2:mem:audit_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

security:
  # a synthetic key for the isolated tests, not a deployment secret
  internal-key: audit-test-only-key-0123456789abcdef0123

eureka:
  client:
    enabled: false
