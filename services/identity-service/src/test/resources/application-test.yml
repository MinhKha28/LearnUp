spring:
  datasource:
    url: jdbc:h2:mem:identity_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

eureka:
  client:
    enabled: false

tenant:
  service-url: http://localhost:65535

learnup:
  recovery:
    notification-base-url: http://127.0.0.1:65534
    frontend-base-url: http://127.0.0.1:5173
    # Existing lifecycle tests are transport-isolated; dedicated integration tests opt in.
    delivery-enabled: false

security:
  internal-key: testInternalServiceKeyAtLeast32BytesLong!
  jwt:
    secret: testSecretKeyForLearnUpPlatformMustBeAtLeast32BytesLong!
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7
