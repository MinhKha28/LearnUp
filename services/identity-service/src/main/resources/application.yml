server:
  port: 8081

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  paths-to-match: /api/v1/auth/**,/api/auth/**
  paths-to-exclude: /api/internal/**
  override-with-generic-response: false

spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

tenant:
  service-url: ${TENANT_SERVICE_URL:http://localhost:8084}

learnup:
  seed:
    enabled: false
  recovery:
    notification-base-url: ${NOTIFICATION_SERVICE_URL}
    frontend-base-url: ${PASSWORD_RECOVERY_FRONTEND_BASE_URL}
    delivery-enabled: true

security:
  internal-key: ${INTERNAL_SERVICE_KEY}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-minutes: 15
    refresh-token-expiration-days: 7

logging:
  level:
    com.learnup.identity: INFO
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized


---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/identity_db

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
