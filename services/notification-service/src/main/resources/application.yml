server:
  port: 8082

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${ENROLLMENT_EVENTS_GROUP_ID:notification-enrollment-events-v1}
      # A group without a committed offset starts from the oldest message of the topic.
      auto-offset-reset: earliest
      # The listener commits an offset only after the event was handled (or sent to the DLT).
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        debug: false
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}
          connectiontimeout: ${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${SPRING_MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

learnup:
  mail:
    enabled: ${LEARNUP_MAIL_ENABLED:false}
    from: ${LEARNUP_MAIL_FROM:noreply@learnup.com}

  # Learning enrollment events (EnrollmentAssigned, EnrollmentDueDateExtended, EnrollmentExempted, LearnerWithdrew).
  # Off by default: the service starts without Kafka; Compose turns it on.
  enrollment-events:
    enabled: ${ENROLLMENT_EVENTS_CONSUMER_ENABLED:false}
    topic: ${ENROLLMENT_EVENTS_TOPIC:learnup.learning.enrollment-events}
    # An event older than this is recorded as SKIPPED, not sent: a mail about a due date of last week helps nobody.
    max-age: ${ENROLLMENT_EVENTS_MAX_AGE:72h}
    retry-attempts: ${ENROLLMENT_EVENTS_RETRY_ATTEMPTS:5}
    retry-initial-backoff: ${ENROLLMENT_EVENTS_RETRY_INITIAL_BACKOFF:1s}
    retry-max-backoff: ${ENROLLMENT_EVENTS_RETRY_MAX_BACKOFF:30s}
    default-time-zone: ${ENROLLMENT_EVENTS_DEFAULT_TIME_ZONE:Asia/Ho_Chi_Minh}

security:
  internal-key: ${INTERNAL_SERVICE_KEY:}

# Other services this one asks for the names and e-mail of the people it writes to (event consumer).
tenant:
  service-url: ${TENANT_SERVICE_URL:http://localhost:8084}
course:
  service-url: ${COURSE_SERVICE_URL:http://localhost:8083}
  timeout-ms: ${COURSE_SERVICE_TIMEOUT_MS:3000}

eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized


logging:
  level:
    com.learnup.notification: INFO
    org.springframework.web: INFO

---
spring:
  config:
    activate:
      on-profile: docker

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
