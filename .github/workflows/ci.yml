name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides which packages need to run, from the files changed in the push or PR.
  # Plain git diff is used instead of a third-party path-filter action.
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node_matrix: ${{ steps.detect.outputs.node_matrix }}
      has_node: ${{ steps.detect.outputs.has_node }}
      java_matrix: ${{ steps.detect.outputs.java_matrix }}
      has_java: ${{ steps.detect.outputs.has_java }}
      ts_libs: ${{ steps.detect.outputs.ts_libs }}
      course_e2e: ${{ steps.detect.outputs.course_e2e }}
      learning_it: ${{ steps.detect.outputs.learning_it }}
      assessment_it: ${{ steps.detect.outputs.assessment_it }}
      kafka_topics: ${{ steps.detect.outputs.kafka_topics }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ]; then
            base="$PUSH_BEFORE_SHA"
          fi

          run_all=false
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            run_all=true
            changed=""
          else
            changed="$(git diff --name-only "$base" "$GITHUB_SHA")"
          fi

          touched() {
            [ "$run_all" = true ] && return 0
            printf '%s\n' "$changed" | grep -Eq "$1"
          }

          if touched '^(\.github/workflows/ci\.yml|\.nvmrc)$'; then run_all=true; fi

          # Every package with a file: dependency on a library under libraries/.
          # Derived from package.json files, not hard-coded.
          mapfile -t consumers < <(
            grep -l '"file:[./]*libraries/' services/*/package.json frontend/package.json 2>/dev/null \
              | xargs -r -n1 dirname | sort -u
          )
          echo "ts library consumers: ${consumers[*]}"

          libs_changed=false
          if touched '^libraries/(ts-common|ts-storage)/'; then libs_changed=true; fi

          topics_changed=false
          if touched '^infrastructure/kafka/'; then topics_changed=true; fi

          node='[]'
          add_node() { # name dir prisma unit lint_glob tsc_blocking
            node="$(jq -c --arg n "$1" --arg d "$2" --argjson p "$3" --arg u "$4" \
              --arg l "$5" --argjson t "$6" \
              '. + [{name:$n, dir:$d, prisma:$p, unit:$u, lint:$l, tsc_blocking:$t}]' <<<"$node")"
          }

          is_consumer() { printf '%s\n' "${consumers[@]}" | grep -qx "$1"; }
          want() { # dir
            [ "$run_all" = true ] && return 0
            { [ "$libs_changed" = true ] && is_consumer "$1"; } && return 0
            if [ "$topics_changed" = true ]; then
              case "$1" in
                services/course-service|services/learning-service|services/assessment-service|services/achievement-reporting-service) return 0 ;;
              esac
            fi
            touched "^$1/"
          }

          want services/learning-service && add_node learning services/learning-service true \
            'NODE_PATH="$PWD" npm run test:unit' '"src/**/*.ts"' true
          want services/tenant-service && add_node tenant services/tenant-service true \
            'npm run test:unit' '"src/**/*.ts"' true
          want services/course-service && add_node course services/course-service true \
            'npx jest --ci' '"{src,apps,libs,test}/**/*.ts"' false
          want services/assessment-service && add_node assessment services/assessment-service true \
            'npm run test:unit' '"src/**/*.ts"' true
          want services/achievement-reporting-service && add_node achievement services/achievement-reporting-service true \
            'npm run test:unit' '"src/**/*.ts"' true
          want frontend && add_node frontend frontend false \
            'npm test' '.' true

          java='[]'
          add_java() { # name dir needs_common
            java="$(jq -c --arg n "$1" --arg d "$2" --argjson c "$3" \
              '. + [{name:$n, dir:$d, needs_common:$c}]' <<<"$java")"
          }
          jwant() { # dir
            [ "$run_all" = true ] && return 0
            touched '^libraries/java-common/' && return 0
            { [ "$topics_changed" = true ] && [ "$1" = services/notification-service ]; } && return 0
            touched "^$1/"
          }
          jwant gateway/api-gateway && add_java gateway gateway/api-gateway true
          jwant infrastructure/eureka-server && add_java eureka infrastructure/eureka-server false
          jwant services/identity-service && add_java identity services/identity-service true
          jwant services/notification-service && add_java notification services/notification-service true
          jwant services/audit-service && add_java audit services/audit-service true

          course_e2e=false
          if [ "$run_all" = true ] || touched '^services/course-service/' \
            || touched '^libraries/(ts-common|ts-storage)/' \
            || [ "$topics_changed" = true ]; then course_e2e=true; fi

          ts_libs=false
          if [ "$libs_changed" = true ] || [ "$run_all" = true ]; then ts_libs=true; fi

          # Learning integration suite: the service itself or its only library.
          learning_it=false
          if [ "$run_all" = true ] || touched '^services/learning-service/' \
            || touched '^libraries/ts-common/' \
            || [ "$topics_changed" = true ]; then learning_it=true; fi

          # Assessment also reads the Course seed and consumes both TS libraries.
          assessment_it=false
          if [ "$run_all" = true ] || touched '^services/assessment-service/' \
            || touched '^libraries/(ts-common|ts-storage)/' \
            || touched '^services/course-service/prisma/seed\.ts$' \
            || [ "$topics_changed" = true ]; then assessment_it=true; fi

          kafka_topics=false
          if [ "$run_all" = true ] || [ "$topics_changed" = true ] \
            || touched '^services/(course|learning|assessment|achievement-reporting)-service/' \
            || touched '^tests/e2e/cluster/' || touched '^docker-compose\.yml$'; then kafka_topics=true; fi

          has_node=false; [ "$node" != '[]' ] && has_node=true
          has_java=false; [ "$java" != '[]' ] && has_java=true

          {
            echo "node_matrix=$node"
            echo "has_node=$has_node"
            echo "java_matrix=$java"
            echo "has_java=$has_java"
            echo "ts_libs=$ts_libs"
            echo "course_e2e=$course_e2e"
            echo "learning_it=$learning_it"
            echo "assessment_it=$assessment_it"
            echo "kafka_topics=$kafka_topics"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Detected packages"
            echo "- run_all: $run_all"
            echo "- node: $(jq -r '[.[].name] | join(", ")' <<<"$node")"
            echo "- java: $(jq -r '[.[].name] | join(", ")' <<<"$java")"
            echo "- ts libraries: $ts_libs"
            echo "- course e2e: $course_e2e"
            echo "- learning integration: $learning_it"
            echo "- assessment integration: $assessment_it"
            echo "- Kafka topic verification: $kafka_topics"
          } >> "$GITHUB_STEP_SUMMARY"

  ts-libraries:
    name: ts-lib (${{ matrix.lib }})
    needs: changes
    if: needs.changes.outputs.ts_libs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lib: [ts-common, ts-storage]
    defaults:
      run:
        working-directory: libraries/${{ matrix.lib }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: libraries/${{ matrix.lib }}/package-lock.json

      # npm ci also runs the package's prepare script, which builds it.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck ts-common tests
        if: matrix.lib == 'ts-common'
        run: npm run typecheck:tests

      # Both TypeScript libraries have blocking unit tests.
      - name: Unit tests
        id: unit
        run: |
          set +e
          npx vitest run 2>&1 | tee "$RUNNER_TEMP/vitest.log"
          rc=${PIPESTATUS[0]}
          {
            echo "### ${{ matrix.lib }} unit tests (exit $rc)"
            grep -E '^\s*(Test Files|Tests)\s' "$RUNNER_TEMP/vitest.log" || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  node:
    name: node (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.has_node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.node_matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            ${{ matrix.dir }}/package-lock.json
            libraries/ts-common/package-lock.json
            libraries/ts-storage/package-lock.json

      # Services consume the libraries through file: dependencies, so the
      # libraries have to be installed and built before the service install.
      - name: Build ts libraries
        if: matrix.name != 'frontend'
        working-directory: libraries
        run: |
          for lib in ts-common ts-storage; do
            (cd "$lib" && npm ci && npm run build)
          done

      - name: Install
        run: npm ci

      - name: Prisma generate
        if: matrix.prisma
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Typecheck frontend
        if: matrix.name == 'frontend'
        run: npm run typecheck

      - name: Typecheck (default tsconfig)
        if: matrix.name != 'frontend'
        continue-on-error: ${{ !matrix.tsc_blocking }}
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/tsc.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "### ${{ matrix.name }} tsc --noEmit: $(grep -c 'error TS' "$RUNNER_TEMP/tsc.log" || true) errors (non-blocking, known on develop)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      - name: Unit tests
        run: ${{ matrix.unit }}

      # Lint is run without --fix. It fails on develop today, so it never blocks.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: |
          set +e
          npx eslint ${{ matrix.lint }} -f json -o "$RUNNER_TEMP/eslint.json"
          rc=$?
          errors="$(jq '[.[].errorCount] | add // 0' "$RUNNER_TEMP/eslint.json")"
          warnings="$(jq '[.[].warningCount] | add // 0' "$RUNNER_TEMP/eslint.json")"
          echo "### ${{ matrix.name }} eslint: $errors errors, $warnings warnings (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          npx eslint ${{ matrix.lint }} | tail -n 40
          exit $rc

  java:
    name: java (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.has_java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.java_matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install java-common
        if: matrix.needs_common
        working-directory: libraries/java-common
        run: mvn -B -ntp install

      - name: Verify
        working-directory: ${{ matrix.dir }}
        run: mvn -B -ntp verify

  # Course suites use disposable PostgreSQL databases; the relay has its own.
  course-e2e:
    name: course integration
    needs: changes
    if: needs.changes.outputs.course_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: course_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/course-service
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/course_e2e_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            services/course-service/package-lock.json
            libraries/ts-common/package-lock.json
            libraries/ts-storage/package-lock.json

      - name: Build ts libraries
        working-directory: libraries
        run: |
          for lib in ts-common ts-storage; do
            (cd "$lib" && npm ci && npm run build)
          done

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate --config prisma7.config.ts

      - name: Migrate disposable database
        id: migrate
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Migrate relay database
        id: migrate_relay
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/course_relay_test
        run: npx prisma migrate deploy --config prisma7.config.ts

      - name: Outbox relay database tests
        id: relay
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' && steps.migrate_relay.outcome == 'success' }}
        env:
          OUTBOX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/course_relay_test
        run: npm run test:relay:db

      - name: HTTP integration tests
        id: e2e
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: npm run test:e2e -- --runInBand

      - name: Catalog duration database tests
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: npm run test:catalog:db

      - name: Enrollment lock database tests
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: npm run test:lock:db

      - name: Course value migration tests
        if: ${{ !cancelled() && steps.migrate.outcome == 'success' }}
        run: npm run test:migration

  # Self-contained Learning integration suite (disposable database, in-process
  # Course stub). Its result feeds the required CI result gate.
  learning-integration:
    name: learning integration
    needs: changes
    if: needs.changes.outputs.learning_it == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/learning-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            services/learning-service/package-lock.json
            libraries/ts-common/package-lock.json

      - name: Build ts-common
        working-directory: libraries/ts-common
        run: npm ci && npm run build

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      # run.cjs creates and drops its own learning_it_* database on this server.
      - name: Integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/learning_db
          LEARNING_IT_TIMING: '1'
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee "$RUNNER_TEMP/learning-it.log"

      # Exposes the longest observed waits as an annotation readable via the API.
      - name: Timing annotation
        if: always()
        run: |
          timing="$(grep -h '^it-timing ' "$RUNNER_TEMP/learning-it.log" | tr '\n' ' ' || true)"
          echo "::notice title=it-timing::$timing"

  assessment-integration:
    name: assessment integration
    needs: changes
    if: needs.changes.outputs.assessment_it == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assessment_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      kafka:
        image: confluentinc/cp-kafka:7.6.0 # Keep the version in step with docker-compose.yml.
        env:
          KAFKA_NODE_ID: '1'
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LOG_DIRS: /var/lib/kafka/data
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
        ports:
          - 9092:9092
        options: >-
          --health-cmd "kafka-topics --bootstrap-server localhost:29092 --list"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 12
    defaults:
      run:
        working-directory: services/assessment-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            services/assessment-service/package-lock.json
            libraries/ts-common/package-lock.json
            libraries/ts-storage/package-lock.json

      - name: Build ts libraries
        working-directory: libraries
        run: |
          for lib in ts-common ts-storage; do
            (cd "$lib" && npm ci && npm run build)
          done

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate --config prisma7.config.ts

      - name: Validate isolated Kafka topic shapes
        working-directory: .
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const {shape} = require('./infrastructure/kafka/test-topics.cjs');
          for (const id of ['assessment-status', 'peer-review-assigned', 'submission-finalized']) {
            assert.equal(shape(id).partitions, 3);
            assert.equal(shape(id).replicationFactor, 1);
          }
          NODE

      # The test harness creates isolated topic names using the shared manifest.
      # Each suite creates, migrates and drops its own assessment_it_* database.
      - name: Integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/assessment_db
          KAFKA_TEST_BROKERS: localhost:9092
          REAL_STORAGE_TEST: '0'
          NODE_ENV: test
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee "$RUNNER_TEMP/assessment-it.log"

  kafka-topics:
    name: Kafka topic verification
    needs: changes
    if: needs.changes.outputs.kafka_topics == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build libraries and Kafka client services
        run: |
          for lib in ts-common ts-storage; do
            (cd "libraries/$lib" && npm ci && npm run build)
          done
          for service in course learning assessment achievement-reporting; do
            (cd "services/$service-service" && npm ci && npx prisma generate --config prisma7.config.ts && npm run build)
          done
      - name: Check Node defaults against topic manifest
        run: node --test infrastructure/kafka/topic-manifest.test.cjs
      - name: Verify fresh, idempotent and drift provisioning
        run: bash infrastructure/kafka/scripts/test-provisioner.sh

  frontend-image:
    name: Frontend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile ./frontend

  ai-signature:
    name: AI signature
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check PR commit metadata
        run: node scripts/check-ai-signatures.mjs

  # Single stable check name for branch protection; passes when every
  # job that ran succeeded and fails if any job failed or was cancelled.
  ci-result:
    name: CI result
    if: always()
    needs: [changes, ts-libraries, node, java, course-e2e, learning-integration, assessment-integration, kafka-topics, frontend-image, ai-signature]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
